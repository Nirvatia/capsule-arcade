<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Pac-Man · Зима: новогодняя сцена</title>
    <!-- Кандидат целостной зимней сцены на настоящем лабиринте и игровых painter-функциях.
         Сборка: `node prototypes/pacman/build.mjs winter-scene`; открыть как файл.
         Query: ?candidate=0&mode=details|decor|readability&mood=storm|night&ms&power&capture&meter -->
    <style>
      :root{color-scheme:dark}
      html,body{height:100%;margin:0;overflow:hidden;background:#0b0e14;color:#edf4fb;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
      #view{position:fixed;inset:0;display:block}
      #ui{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
      .bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;pointer-events:auto}
      .brand{margin-right:7px;color:rgba(220,234,248,.68);font:700 11px "Courier New",monospace;letter-spacing:.08em}
      button{border:1px solid rgba(156,183,211,.25);cursor:pointer;padding:6px 10px;border-radius:999px;color:#dce8f5;background:rgba(14,23,35,.82);box-shadow:0 2px 8px rgba(0,0,0,.18);font:700 11px "Trebuchet MS","Segoe UI",system-ui,sans-serif;backdrop-filter:blur(8px)}
      button:hover{background:rgba(40,57,75,.9)}
      button[aria-pressed="true"]{border-color:rgba(241,197,105,.62);color:#2b250f;background:linear-gradient(#f6e3ae,#d7ae57);box-shadow:0 2px 9px rgba(238,190,91,.22)}
      #tools{position:fixed;z-index:6;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px}
      #layerPanel{display:none;min-width:142px;padding:10px 12px;border:1px solid rgba(156,183,211,.25);border-radius:12px;background:rgba(12,20,31,.9);box-shadow:0 8px 28px rgba(0,0,0,.3);backdrop-filter:blur(10px)}
      #layerPanel.open{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
      #layerPanel label{display:flex;align-items:center;gap:5px;color:#dce8f5;font-size:11px;white-space:nowrap}
      #layerPanel input{accent-color:#d7ae57;margin:0}
      #hint{position:fixed;z-index:4;left:12px;bottom:max(15px,env(safe-area-inset-bottom));max-width:calc(100vw - 190px);color:rgba(224,235,247,.65);font:600 10px "Trebuchet MS","Segoe UI",system-ui,sans-serif;text-shadow:0 1px 4px #000;pointer-events:none}
      @media(max-width:760px){.brand{display:none}button{padding:5px 8px;font-size:10px}#hint{display:none}#ui{left:5px;right:5px;gap:4px}.bar{gap:3px}}
      @media(max-height:500px) and (orientation:landscape){#ui{flex-direction:row;align-items:flex-start;gap:4px}.brand{display:none}.bar{flex-wrap:nowrap;gap:3px}button{padding:4px 7px;font-size:9px}#hint{display:none}}
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Прототип улучшенной зимней сцены Pac-Man"></canvas>
    <div id="ui">
      <div class="bar">
        <span class="brand">ЗИМА · НОВОГОДНЯЯ СЦЕНА</span>
        <button data-mode="scene">Сцена</button>
        <button data-mode="details">Детали</button>
        <button data-mode="decor">Новый год</button>
        <button data-mode="readability">Читаемость</button>
        <button id="candidate">Кандидат</button>
      </div>
      <div class="bar">
        <button data-mood="day">День</button>
        <button data-mood="storm">Метель</button>
        <button data-mood="night">Ночь</button>
        <button id="who">Pac-Man</button>
        <button id="power">Rage / испуг</button>
      </div>
    </div>
    <div id="tools">
      <div id="layerPanel">
        <label><input type="checkbox" data-layer="walls" checked />Стены</label>
        <label><input type="checkbox" data-layer="floor" checked />Коридор</label>
        <label><input type="checkbox" data-layer="lair" checked />Убежище</label>
        <label><input type="checkbox" data-layer="decor" checked />Декор</label>
        <label><input type="checkbox" data-layer="lights" checked />Огни</label>
        <label><input type="checkbox" data-layer="frost" checked />Frost</label>
        <label><input type="checkbox" data-layer="weather" checked />Метель</label>
      </div>
      <button id="layers">Слои</button>
    </div>
    <div id="hint"></div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
