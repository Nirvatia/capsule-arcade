<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Ночной лес</title>
    <!-- Prototype: the boss world "light against the dark", a night forest on the real maze (nightwood/main.ts).
         `node prototypes/pacman/build.mjs nightwood`; open as a file. Buttons below. -->
    <style>
      html,body{height:100%;margin:0;overflow:hidden;background:#04070b}
      #view{position:fixed;inset:0;display:block}
      #ctl{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;width:calc(100vw - 28px);max-width:1200px}
      .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
      .bt{border:1px solid #2a3b48;cursor:pointer;padding:5px 11px;border-radius:5px;font:600 12px ui-monospace,Menlo,monospace;color:#c9dae6;background:#0d161e}
      .bt:hover{background:#142230}
      .bt[aria-pressed="true"]{background:#c98a3a;border-color:#f0b768;color:#0b0d10}
      .lbl{font:12px ui-monospace,Menlo,monospace;color:#7f98a8}
      #note{font:13px ui-monospace,Menlo,monospace;color:#d8e4ec;text-align:center;min-height:2.4em;max-width:920px}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ctl">
      <div id="note"></div>
      <div class="row">
        <span class="lbl">Свет героя:</span>
        <button class="bt" data-light="cone" aria-pressed="true">Фонарь</button>
        <button class="bt" data-light="lamp">Лампа</button>
        <button class="bt" data-light="off">Темно</button>
        <span class="lbl">Враги:</span>
        <button class="bt" data-foes="auto" aria-pressed="true">По свету</button>
        <button class="bt" data-foes="dark">Во тьме</button>
        <button class="bt" data-foes="burn">Горят</button>
        <button class="bt" data-foes="bare">Открыты</button>
        <span class="lbl">Тьма:</span>
        <button class="bt" data-boss="calm" aria-pressed="true">Спит</button>
        <button class="bt" data-boss="angry">Злится</button>
        <button class="bt" id="fog" aria-pressed="true">Туман</button>
        <button class="bt" id="lamps" aria-pressed="true">Фонари</button>
      </div>
    </div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
