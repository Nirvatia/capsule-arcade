<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Pac-Man · Mazes</title>
    <!-- Prototype: the season mazes grid_01..grid_04 (and the classic fallback) drawn by the
         game's own meadow world in every season, with the maze cycle's order for a seed.
         Marks: tunnel pads (cyan), Pac-Man pad (green), fruit pad (magenta), lair (orange).
         Built from the sources: `node prototypes/pacman/build.mjs mazes`; open as a file.
         The page can be opened with #maze=grid_02&season=autumn&marks=1&night=1 -->
    <style>
      html,body{height:100%;margin:0;overflow:hidden;background:#1a1a14}
      #view{position:fixed;inset:0;display:block}
      #ctl{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:calc(100vw - 32px);max-width:900px}
      #info{position:fixed;left:12px;top:10px;z-index:5;color:#f3ead0;font:600 13px system-ui,sans-serif;text-shadow:0 1px 2px #000;white-space:pre}
      .bt{border:0;cursor:pointer;padding:7px 12px;border-radius:999px;font:700 13px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#2a2410;background:linear-gradient(#fffaf0,#f2e2b8);box-shadow:0 3px 0 #c9ac62,0 8px 14px rgba(40,30,10,.22)}
      .bt[aria-pressed="true"]{transform:translateY(2px);color:#fff;background:linear-gradient(#e0a838,#a8721a);box-shadow:0 1px 0 #5a3a08,0 0 14px rgba(255,200,80,.6)}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="info"></div>
    <div id="ctl">
      <button class="bt" data-maze="grid_01">grid_01</button>
      <button class="bt" data-maze="grid_02">grid_02</button>
      <button class="bt" data-maze="grid_03">grid_03</button>
      <button class="bt" data-maze="grid_04">grid_04</button>
      <button class="bt" data-maze="classic01">classic01</button>
      <button class="bt" data-season="summer">Лето</button>
      <button class="bt" data-season="autumn">Осень</button>
      <button class="bt" data-season="winter">Зима</button>
      <button class="bt" data-season="spring">Весна</button>
      <button class="bt" id="night" aria-pressed="false">☾ Ночь</button>
      <button class="bt" id="marks" aria-pressed="false">Метки</button>
    </div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
