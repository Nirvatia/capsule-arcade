<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Картридж</title>
    <!-- Prototype: the boss world "the cartridge" (a bad retro port) on the game's arcade board and CRT pass.
         `node prototypes/pacman/build.mjs cartridge`; open as a file. Buttons below pick the boss's mood and the world's rule. -->
    <style>
      html,body{height:100%;margin:0;overflow:hidden;background:#000}
      #view{position:fixed;inset:0;display:block}
      #ctl{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;width:calc(100vw - 32px);max-width:1100px}
      .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
      .bt{border:0;cursor:pointer;padding:6px 11px;border-radius:6px;font:700 12px "Courier New",monospace;color:#04030c;background:#2ee6d6;box-shadow:0 3px 0 #0f6f73}
      .bt[aria-pressed="true"]{transform:translateY(2px);background:#ffd400;box-shadow:0 1px 0 #c08a00}
      .lbl{font:12px "Courier New",monospace;color:#9adcd6}
      #note{font:13px "Courier New",monospace;color:#f4f4ff;text-align:center;min-height:2.6em;max-width:900px}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ctl">
      <div id="note"></div>
      <div class="row">
        <span class="lbl">Босс:</span>
        <button class="bt" data-mood="calm" aria-pressed="true">Спокоен</button>
        <button class="bt" data-mood="angry">Зол</button>
        <span class="lbl">Правило мира:</span>
        <button class="bt" data-rule="clean" aria-pressed="true">Чисто</button>
        <button class="bt" data-rule="glitch">Глитч</button>
        <button class="bt" data-rule="pits">Ямы</button>
        <button class="bt" data-rule="fake">Ложные стены</button>
        <button class="bt" data-rule="flicker">Мерцание</button>
        <button class="bt" data-rule="lag">Лаг</button>
        <button class="bt" data-rule="over">Продолжить?</button>
        <button class="bt" id="crt" aria-pressed="true">ЭЛТ</button>
      </div>
    </div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
