      col += PHOSPHOR * uGlow * exp(-r / 0.012) * step(uOpen.x, 0.02) * 1.2;
    } else {
      float reach = length(uScenePx) * 0.5 * 1.05;
      float R = uGrow * reach;
      float r = length(css - uOrigin);
      float inside = 1.0 - smoothstep(R - 6.0, R, r);
      vec3 w = texture(uTo, uv).rgb;
      col = w * inside;
      float rim = exp(-sq((r - R) / (5.0 + 16.0 * (1.0 - uGrow))));
      col += mix(uAccent, vec3(1.0), 0.5) * rim * (1.0 - 0.6 * uGrow) * 0.9;
      col += PHOSPHOR * uGlow * exp(-length(css - uOrigin) / (U * 0.012)) * 1.2;
    }
  }
  outColor = vec4(min(col, vec3(1.6)), 1.0);
}`;
	//#endregion
	//#region src/games/pacman/render/transitions/arcadeShift/arcadeShiftTimeline.ts
	/**
	* The clock of the arcade shift: the way into the arcade (`enter`, a world breaking into
	* pixels and a CRT switching on) and the way out (`leave`, the CRT switching off and the
	* dot of light unfolding into the next world). A pure function of the progress 0..1, so the
	* shader and the tests read the same numbers.
	*/
	/** Seconds each shift takes. */
	var SHIFT_DURATION = FLOW.worldShift;
	/** Mosaic block sizes, css px at an 800 px short side, and the colour levels at each step. */
	var MOSAIC_BLOCKS = [
		1,
		2,
		3,
		5,
		8,
		13,
		21
	];
	var MOSAIC_LEVELS = [
		256,
		64,
		32,
		16,
		10,
		7,
		5
	];
	var clamp01 = (x) => Math.min(1, Math.max(0, x));
	var span = (p, a, b) => clamp01((p - a) / (b - a));
	var smooth = (t) => t * t * (3 - 2 * t);
	var easeIn = (t) => t * t * t;
	var easeOut = (t) => 1 - Math.pow(1 - t, 3);
	/** Where the enter's world gives way to the dark and to the CRT. */
	var ENTER = {
		flashEnd: .14,
		pixelFrom: .06,
		pixelTo: .4,
		dimTo: .52,
		lineFrom: .56,
		lineTo: .64,
		openTo: .86,
		settleTo: .96
	};
	/** The leave's squash, shrink, afterglow and growth. */
	var LEAVE = {
		squashTo: .34,
		shrinkTo: .52,
		glowTo: .74,
		growFrom: .7
	};
	/** Channels at progress `p` (clamped to 0..1). */
	function shiftChannels(kind, progress) {
		const p = clamp01(Number.isFinite(progress) ? progress : 0);
		if (kind === "enter") {
			const flash = p < ENTER.flashEnd ? Math.pow(1 - p / ENTER.flashEnd, 2) : 0;
			const t = smooth(span(p, ENTER.pixelFrom, ENTER.pixelTo));
			const step = Math.min(MOSAIC_BLOCKS.length - 1, Math.floor(t * MOSAIC_BLOCKS.length));
			const dim = 1 - easeIn(span(p, ENTER.pixelTo, ENTER.dimTo));
			const phase = p < ENTER.lineFrom ? 0 : 1;
			const line = easeOut(span(p, ENTER.lineFrom, ENTER.lineTo));
			const open = smooth(span(p, ENTER.lineTo, ENTER.openTo));
			return {
				kind,
				phase,
				flash,
				block: MOSAIC_BLOCKS[step],
				levels: MOSAIC_LEVELS[step],
				dim,
				openX: phase === 0 ? 0 : line,
				openY: phase === 0 ? 0 : open,
				boost: 1 + 1.4 * (1 - span(p, ENTER.lineTo, ENTER.settleTo)),
				glow: 0,
				grow: 0
			};
		}
		const squash = easeIn(span(p, 0, LEAVE.squashTo));
		const shrink = easeIn(span(p, LEAVE.squashTo, LEAVE.shrinkTo));
		const glowT = span(p, LEAVE.shrinkTo, LEAVE.glowTo);
		return {
			kind,
			phase: 0,
			flash: 0,
			block: 1,
			levels: 256,
			dim: 1,
			openX: 1 - shrink,
			openY: 1 - squash,
			boost: 1 + 1.4 * span(p, 0, LEAVE.shrinkTo),
			glow: p < LEAVE.shrinkTo ? 1 : Math.pow(1 - glowT, 1.6),
			grow: easeOut(span(p, LEAVE.growFrom, 1))
		};
	}
	//#endregion
	//#region src/games/pacman/render/transitions/arcadeShift/ArcadeShift.ts
	var MAX_PASS_RATIO = 1.5;
	var UNIFORMS = [
		"uFrom",
		"uTo",
		"uSizePx",
		"uScenePx",
		"uOrigin",
		"uMode",
		"uPhase",
		"uFlash",
		"uBlock",
		"uLevels",
		"uDim",
		"uOpen",
		"uBoost",
		"uGlow",
		"uGrow",
		"uTime",
		"uAccent"
	];
	/**
	* The way into the arcade and out of it: a world breaking into pixels while a CRT switches
	* on, and a CRT switching off while a dot of light unfolds into the next world. Per frame:
	* draw the picture that is leaving into `from()`, the one that arrives into `to()`, then
	* `compose()`. Without WebGL2 it cuts through black.
	*/
	var ArcadeShift = class {
		pass;
		scenes = [null, null];
		from(pixelWidth, pixelHeight) {
			return this.scene(0, pixelWidth, pixelHeight);
		}
		to(pixelWidth, pixelHeight) {
			return this.scene(1, pixelWidth, pixelHeight);
		}
		compose(ctx, width, height, pixelRatio, request) {
			const from = this.scenes[0];
			const to = this.scenes[1];
			if (!from || !to) return;
			const c = shiftChannels(request.kind, request.progress);
			if (this.pass === void 0) {
				this.pass = GlPass.create("ArcadeShift", ARCADE_SHIFT_FRAGMENT, UNIFORMS);
				this.pass?.addTexture(0, "uFrom", "linear");
				this.pass?.addTexture(1, "uTo", "linear");
			}
			ctx.save();
			ctx.globalAlpha = 1;
			ctx.globalCompositeOperation = "source-over";
			const pass = this.pass;
			if (pass) {
				const ratio = Math.min(pixelRatio, MAX_PASS_RATIO);
				const pw = Math.round(width * ratio);
				const ph = Math.round(height * ratio);
				const gl = pass.gl;
				const l = (name) => pass.uniform(name);
				pass.uploadCanvas(0, from.cv);
				pass.uploadCanvas(1, to.cv);
				gl.uniform2f(l("uSizePx"), pw, ph);
				gl.uniform2f(l("uScenePx"), width, height);
				gl.uniform2f(l("uOrigin"), request.originX, request.originY);
				gl.uniform1f(l("uMode"), c.kind === "enter" ? 0 : 1);
				gl.uniform1f(l("uPhase"), c.phase);
				gl.uniform1f(l("uFlash"), c.flash);
				gl.uniform1f(l("uBlock"), c.block);
				gl.uniform1f(l("uLevels"), c.levels);
				gl.uniform1f(l("uDim"), c.dim);
				gl.uniform2f(l("uOpen"), c.openX, c.openY);
				gl.uniform1f(l("uBoost"), c.boost);
				gl.uniform1f(l("uGlow"), c.glow);
				gl.uniform1f(l("uGrow"), c.grow);
				gl.uniform1f(l("uTime"), request.time);
				gl.uniform3f(l("uAccent"), ...rgb01(request.accent));
				pass.draw(pw, ph);
				ctx.drawImage(pass.canvas, 0, 0, width, height);
			} else {
				const showTo = c.kind === "enter" ? c.phase === 1 : c.grow > 0;
				ctx.fillStyle = "#000";
				ctx.fillRect(0, 0, width, height);
				if (showTo || c.openY > .2) ctx.drawImage(showTo ? to.cv : from.cv, 0, 0, width, height);
			}
			ctx.restore();
		}
		scene(index, pixelWidth, pixelHeight) {
			let s = this.scenes[index];
			if (!s) {
				const cv = makeCanvas(pixelWidth, pixelHeight);
				s = {
					cv,
					ctx: canvasContext(cv)
				};
				this.scenes[index] = s;
			}
			if (s.cv.width !== pixelWidth || s.cv.height !== pixelHeight) {
				s.cv.width = pixelWidth;
				s.cv.height = pixelHeight;
			}
			return s.ctx;
		}
	};
	//#endregion
	//#region prototypes/pacman/shift/main.ts
	var $ = (id) => document.getElementById(id);
	var view = $("view");
	var ctx = view.getContext("2d");
	var D = Math.min(window.devicePixelRatio || 1, 2);
	var q = new URLSearchParams(location.search);
	var kind = q.get("kind") === "leave" ? "leave" : "enter";
	var season = q.get("season") || "summer";
	var progress = Math.min(1, Math.max(0, Number(q.get("t") ?? 0)));
	var playing = false;
	var speed = 1;
	var vw = 0;
	var vh = 0;
	var world;
	var arcade = new ArcadeLevelRenderer();
	var shift = new ArcadeShift();
	var arcadeSeason = secretSeason();
	/** The Easter egg's tile: the lair's centre. */
	var EGG = {
		x: 12.5,
		y: 13.5
	};
	function buildWorld() {
		world = new MeadowWorld(GRID_01, meadowThemeFor(season));
		world.resize(vw, vh, D);
		world.setMood(0, 0);
	}
	function layout() {
		vw = window.innerWidth;
		vh = window.innerHeight;
		view.width = Math.round(vw * D);
		view.height = Math.round(vh * D);
		view.style.width = `${vw}px`;
		view.style.height = `${vh}px`;
		buildWorld();
	}
	function drawSeason(target, withHero) {
		target.setTransform(D, 0, 0, D, 0, 0);
		world.drawWorld(target);
		world.drawMood(target);
		world.drawFood(target, () => false);
		world.drawOverlay(target);
		if (withHero) {
			const L = world.layout;
			const x = L.offsetX + EGG.x * L.tileSize;
			const y = L.offsetY + EGG.y * L.tileSize;
			target.fillStyle = "#ffd23a";
			target.beginPath();
			target.arc(x, y, L.tileSize * .42, 0, Math.PI * 2);
			target.fill();
			target.fillStyle = "#ffd6ec";
			target.beginPath();
			target.ellipse(x + L.tileSize * .7, y, L.tileSize * .28, L.tileSize * .36, 0, 0, Math.PI * 2);
			target.fill();
		}
	}
	function drawArcade(target) {
		target.setTransform(D, 0, 0, D, 0, 0);
		arcade.preview({
			ctx: target,
			width: vw,
			height: vh,
			pixelRatio: D,
			dt: 0,
			paused: true,
			season: arcadeSeason
		});
	}
	var clock = 0;
	var last = performance.now();
	function frame(now) {
		const dt = Math.min(.05, (now - last) / 1e3);
		last = now;
		clock += dt;
		world.update(dt);
		if (playing) {
			progress += dt * speed / SHIFT_DURATION[kind];
			if (progress >= 1) {
				progress = 1;
				playing = false;
				$("bp").textContent = "▶ Играть";
			}
		}
		const w = view.width;
		const h = view.height;
		const L = world.layout;
		const eggX = L.offsetX + EGG.x * L.tileSize;
		const eggY = L.offsetY + EGG.y * L.tileSize;
		if (kind === "enter") {
			drawSeason(shift.from(w, h), true);
			drawArcade(shift.to(w, h));
		} else {
			drawArcade(shift.from(w, h));
			drawSeason(shift.to(w, h), false);
		}
		ctx.setTransform(D, 0, 0, D, 0, 0);
		shift.compose(ctx, vw, vh, D, {
			kind,
			progress,
			originX: kind === "enter" ? eggX : vw / 2,
			originY: kind === "enter" ? eggY : vh / 2,
			accent: kind === "enter" ? 16766700 : 16769952,
			time: clock
		});
		$("ts").value = String(Math.round(progress * 1e3));
		$("tt").textContent = `${(progress * SHIFT_DURATION[kind]).toFixed(2)} / ${SHIFT_DURATION[kind]} s`;
		requestAnimationFrame(frame);
	}
	function press(attr) {
		for (const b of document.querySelectorAll(`[data-${attr}]`)) b.setAttribute("aria-pressed", String(b.dataset[attr] === (attr === "kind" ? kind : season)));
	}
	for (const b of document.querySelectorAll("[data-kind]")) b.addEventListener("click", () => {
		kind = b.dataset.kind;
		progress = 0;
		playing = true;
		$("bp").textContent = "❚❚ Пауза";
		press("kind");
	});
	for (const b of document.querySelectorAll("[data-season]")) b.addEventListener("click", () => {
		season = b.dataset.season;
		buildWorld();
		press("season");
	});
	$("bp").addEventListener("click", () => {
		if (progress >= 1) progress = 0;
		playing = !playing;
		$("bp").textContent = playing ? "❚❚ Пауза" : "▶ Играть";
	});
	$("bv").addEventListener("click", () => {
		speed = speed === 1 ? .25 : 1;
		$("bv").textContent = speed === 1 ? "1×" : "¼×";
	});
	$("ts").addEventListener("input", (e) => {
		progress = Number(e.target.value) / 1e3;
		playing = false;
		$("bp").textContent = "▶ Играть";
	});
	window.addEventListener("resize", layout);
	layout();
	press("kind");
	press("season");
	requestAnimationFrame(frame);
	//#endregion
})();
</script>
