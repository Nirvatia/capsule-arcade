<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Станция B-7</title>
    <!-- Prototype: the station B-7 as the game draws it (station-b7/main.ts). `node prototypes/pacman/build.mjs station-b7`; open as a file.
         Buttons on top (main.ts). -->
    <style>
      :root{color-scheme:dark}
      html,body{margin:0;height:100%;overflow:hidden;background:#07090a}
      canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
      #bar{position:fixed;left:10px;top:8px;display:flex;flex-direction:column;gap:4px;font:12px/1.3 ui-monospace,monospace;color:#cfd8d4;background:rgba(8,11,11,.82);padding:7px 9px;border-radius:4px;max-width:calc(100vw - 40px)}
      .grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
      .grp span{width:78px;color:#8fa19b}
      button{font:inherit;color:#cfd8d4;background:#1a2122;border:1px solid #3a4644;border-radius:3px;padding:3px 8px;cursor:pointer}
      button:hover{background:#243031}
      button.on{background:#c9762f;border-color:#f0a35e;color:#0b0d0d}
      .note{white-space:pre;color:#e8d6b8;margin-top:3px}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar"></div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
