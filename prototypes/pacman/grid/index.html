<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Pac-Man · Grid</title>
    <!-- Prototype: the look of the grid world (the TRON-language boss level) on the real grid_tron.
         Built from the sources: `node prototypes/pacman/build.mjs grid`; open as a file. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" />
    <style>
      :root{color-scheme:dark}
      html,body{height:100%;margin:0;overflow:hidden;background:#000104;color:#e8fdff}
      #stage{position:fixed;inset:0;transform-origin:50% 62%}
      #view,#hud{position:fixed;inset:0;display:block}
      #hud{pointer-events:none}
      #ctl{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:calc(100vw - 32px);max-width:900px}
      .bt{cursor:pointer;padding:7px 14px;border:1px solid rgba(63,224,255,.55);background:rgba(2,10,16,.85);color:#bff4ff;font:600 12px Orbitron,"Arial Narrow",sans-serif;letter-spacing:.06em;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
      .bt[aria-pressed="true"]{background:rgba(63,224,255,.22);color:#fff;border-color:#bff4ff}
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <canvas id="hud"></canvas>
    <div id="ctl">
      <button class="bt" data-light="a"></button>
      <button class="bt" data-light="b"></button>
      <button class="bt" data-light="c"></button>
      <button class="bt" id="tilt" aria-pressed="false">Вид: сверху</button>
      <button class="bt" id="who">Pac-Man</button>
      <button class="bt" id="dive">Заход</button>
    </div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
