			combat.setPowerDuration(tuning.power);

			player.setSpeedModifier(tuning.playerSpeed);
			fruit.setKind(tuning.fruit);

			resetWinterDetails();
			buildWorld();
		});
	});
	fitCanvas();
	startSession();
	updateControls();
	if (q.has("capture")) {
		for (let i = 0; i < 240; i++) frame(1 / 60);
		window.__advance = (seconds) => {
			for (let i = 0; i < Math.round(seconds * 60); i++) frame(1 / 60);
		};
	} else {
		let last = performance.now();
		const loop = (now) => {
			const dt = Math.min(.1, Math.max(0, (now - last) / 1e3));
			last = now;
			frame(dt);
			requestAnimationFrame(loop);
		};
		requestAnimationFrame(loop);
	}
	//#endregion
})();

    </script>
  </body>
</html>
