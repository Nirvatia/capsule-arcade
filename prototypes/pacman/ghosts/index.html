<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pac-Man · Blinky and imps on the red</title>
    <!-- Throwaway comparison page (part II, 1, second round, item 4): the boss and the imps in the
         hell's real maze, six ways to part them from the red. Built from the game's sources:
         `node prototypes/pacman/build.mjs ghosts`. Delete when the owner has chosen. -->
    <style>
      html,body{margin:0;background:#0b0606;color:#f0d8d0;font:14px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
      main{max-width:920px;margin:0 auto;padding:16px}
      h1{font-size:18px;margin:0 0 4px}
      p.lead{margin:0 0 12px;color:#caa9a0}
      .bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
      .bt{border:0;cursor:pointer;padding:7px 12px;border-radius:999px;font:700 13px inherit;color:#2a1010;background:linear-gradient(#fff2ea,#e8c2b0)}
      .bt[aria-pressed="true"]{color:#fff;background:linear-gradient(#e0402a,#901a10)}
      section{margin:0 0 14px}
      h2{font-size:15px;margin:0 0 2px}
      h2 b{display:inline-block;min-width:22px;color:#ff8a6a}
      section p{margin:0 0 4px;color:#caa9a0;font-size:13px}
      canvas{display:block;width:100%;border-radius:6px;border:1px solid #3a1a16}
      .gray canvas{filter:grayscale(1)}
      .names{display:flex;font-size:11px;color:#9c817a;margin:0 0 10px}
      .names span{flex:1;text-align:center}
    </style>
  </head>
  <body>
    <main>
      <h1>Блинки и импы на красном</h1>
      <p class="lead">Настоящий лабиринт ада, коридор 8-го ряда. Слева направо: Блинки фаз 1, 2, 3, эхо, Пинки, Инки, Клайд. Размер игры увеличен примерно в 1,7 раза.</p>
      <div class="bar">
        <button class="bt" id="night" aria-pressed="false">Ночь</button>
        <button class="bt" id="gray" aria-pressed="false">Оттенки серого</button>
      </div>
      <div class="names"><span>фаза 1</span><span>фаза 2</span><span>фаза 3</span><span>эхо</span><span>Пинки</span><span>Инки</span><span>Клайд</span></div>
      <div id="list"></div>
    </main>
    <script>/*SCRIPT*/</script>
  </body>
</html>
