<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Pac-Man · Gameplay effects</title>
    <!-- Prototype: the season levels' gameplay effects (step 5.4), played by the game's own
         LevelFx on the real season worlds. Click the board to fire the chosen event there.
         Built from the sources: `node prototypes/pacman/build.mjs fx`; open as a file. -->
    <style>
      html,body{height:100%;margin:0;overflow:hidden;background:#1a1a14}
      #view{position:fixed;inset:0;display:block;cursor:crosshair}
      #ctl{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:calc(100vw - 32px);max-width:900px}
      .bt{border:0;cursor:pointer;padding:9px 14px;border-radius:999px;font:700 14px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#2a2410;background:linear-gradient(#fffaf0,#f2e2b8);box-shadow:0 3px 0 #c9ac62,0 8px 14px rgba(40,30,10,.22)}
      .bt[aria-pressed="true"]{transform:translateY(2px);color:#fff;background:linear-gradient(#e0a838,#a8721a);box-shadow:0 1px 0 #5a3a08,0 0 14px rgba(255,200,80,.6)}
      #note{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;font:600 12px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#3a3020;background:rgba(255,250,235,.8);padding:5px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="note">клик по полю: выбранное событие в этой точке</div>
    <div id="ctl">
      <button class="bt" data-season="summer">Лето</button>
      <button class="bt" data-season="autumn">Осень</button>
      <button class="bt" data-season="winter">Зима</button>
      <button class="bt" data-season="spring">Весна</button>
      <button class="bt" id="night" aria-pressed="false">☾ Ночь</button>
      <button class="bt" data-event="ghost-eaten">Призрак</button>
      <button class="bt" data-event="energizer">Энергайзер</button>
      <button class="bt" data-event="fruit">Фрукт</button>
      <button class="bt" data-event="egg">Яйцо</button>
      <button class="bt" data-event="extra-life">1UP</button>
      <button class="bt" data-event="teleport">Телепорт</button>
      <button class="bt" data-event="echo-pop">Клон</button>
      <button class="bt" data-event="near-miss">Near miss</button>
      <button class="bt" id="slow" aria-pressed="true">0.25×</button>
    </div>
    <script>/*SCRIPT*/</script>
  </body>
</html>
