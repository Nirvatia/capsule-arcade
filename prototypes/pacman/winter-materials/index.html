<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Зима: материал стен</title>
    <!-- Prototype for stage 4: the winter wall material. The real winter maze and atmosphere;
         three wall candidates (current walls as control, snowy stone, snow-covered wood) drawn
         in code on top of the real bake. Day only. `node prototypes/pacman/build.mjs
         winter-materials`; open as a file. -->
    <style>
      :root{color-scheme:dark}
      html,body{margin:0;background:#07111f;color:#e8f2ff;font:14px "Trebuchet MS","Segoe UI",system-ui,sans-serif}
      body{height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
      header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:12px 16px 8px;border-bottom:1px solid #203752;background:#0a1728}
      h1{margin:0;font:700 20px "Arial Narrow",system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
      p{margin:3px 0 0;color:#91aac7;max-width:78ch}
      .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
      button{font:700 14px "Arial Narrow",system-ui,sans-serif;letter-spacing:.03em;color:#e8f2ff;background:#12243a;border:1px solid #31547a;border-radius:6px;padding:7px 13px;cursor:pointer}
      button[aria-pressed="true"]{background:#dff4ff;color:#07111f;border-color:#dff4ff}
      canvas{display:block;width:100%;height:100%}
      #cap{position:fixed;right:18px;bottom:18px;z-index:5;pointer-events:none;font:600 12px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#3a4d66;background:rgba(255,255,255,.78);padding:4px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(40,55,90,.25)}
      @media (max-width:760px){header{display:block}.bar{justify-content:flex-start;margin-top:8px}p{font-size:13px}}
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Зима: материал стен</h1>
        <p>Настоящий зимний лабиринт, только день. Меняется только материал стен: текущие (контроль), снежный камень, заснеженное дерево. Снег и иней — часть материала, вид строго сверху, коридоры не тронуты. Справа внизу — увеличенный фрагмент.</p>
      </div>
      <div class="bar" id="bar">
        <button type="button" data-v="control" aria-pressed="true">Текущие (контроль)</button>
        <button type="button" data-v="stone" aria-pressed="false">Снежный камень</button>
        <button type="button" data-v="wood" aria-pressed="false">Заснеженное дерево</button>
      </div>
    </header>
    <canvas id="view"></canvas>
    <div id="cap">Фрагмент</div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
