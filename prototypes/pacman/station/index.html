<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Станция, макет</title>
    <!-- Prototype: the station boss level's look (DESIGN.md §7a) on the real `grid_station`: the
         dark deck, the flashlight, the ghosts, the cocoon and the hunters, the tracker, the three
         phases. `node prototypes/pacman/build.mjs station`; open as a file.
         Query: ?style=a|b &phase=1|2|3 &mode=scene|zoom|gallery &t=<seconds, freezes time> -->
    <style>
      :root{color-scheme:dark}
      html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:#d8e2ea;font:14px "Trebuchet MS","Segoe UI",system-ui,sans-serif}
      canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
      .bar{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
      button{font:700 13px "Arial Narrow",system-ui,sans-serif;letter-spacing:.04em;color:#d8e2ea;background:rgba(14,18,24,.85);border:1px solid #2b3642;border-radius:6px;padding:6px 12px;cursor:pointer}
      button[aria-pressed="true"]{background:#62f5c8;color:#04130d;border-color:#62f5c8}
      .sep{width:8px}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="bar">
      <button type="button" data-style="a">Стиль A</button>
      <button type="button" data-style="b">Стиль B</button>
      <span class="sep"></span>
      <button type="button" data-phase="1">Фаза 1: свет</button>
      <button type="button" data-phase="2">Фаза 2: авария</button>
      <button type="button" data-phase="3">Фаза 3: гнездо</button>
      <span class="sep"></span>
      <button type="button" data-mode="scene">Сцена</button>
      <button type="button" data-mode="zoom">Крупно</button>
      <button type="button" data-mode="gallery">Галерея</button>
    </div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
