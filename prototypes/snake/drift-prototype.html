<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Дрейф — спокойная змейка</title>
<style>
  :root{--ink:#e2f8ff;--dim:#8fb4c8;--glow:#6ff3ff;color-scheme:dark}
  html,body{margin:0;height:100%;background:#02060f;overflow:hidden;color:var(--ink);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;pointer-events:none;text-shadow:0 0 14px rgba(80,220,255,.55);transition:opacity .9s ease}
  #stat{left:24px;top:20px;display:flex;flex-direction:column;gap:9px}
  #cyc{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
  #sparks{display:flex;align-items:center;gap:6px;min-height:14px;font-size:13px;color:var(--ink);letter-spacing:.08em}
  .orb{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#7ff6ff 45%,#18a8c8 100%);box-shadow:0 0 10px 2px rgba(90,240,255,.7);animation:orb 2.8s ease-in-out infinite}
  .orb:nth-child(2n){animation-delay:-1.1s}.orb:nth-child(3n){animation-delay:-2s}
  @keyframes orb{50%{transform:scale(.78);box-shadow:0 0 6px 1px rgba(90,240,255,.5)}}
  #sparkn{margin-left:6px;color:var(--dim)}
  #pats{top:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
  .pat{width:11px;height:11px;border-radius:3px;transform:rotate(45deg);border:1.5px solid #6fa3bd;background:transparent;transition:all .8s ease}
  .pat.lit{background:var(--glow);border-color:#d8fcff;box-shadow:0 0 12px 3px rgba(111,243,255,.7)}
  #hint{left:50%;bottom:34px;transform:translateX(-50%);font-size:15px;letter-spacing:.06em;opacity:0;width:max-content;max-width:min(88vw,620px);text-align:center;line-height:1.35;
    padding:9px 20px;border-radius:999px;background:rgba(3,14,30,.62);border:1px solid rgba(130,220,255,.3)}
  #hint.on{opacity:1}
  #banner{left:0;right:0;top:38%;text-align:center;opacity:0}
  #banner.on{opacity:1}
  #banner b{display:block;font-weight:200;font-size:clamp(28px,5.4vw,64px);letter-spacing:.34em;text-transform:uppercase;text-indent:.34em}
  #banner i{display:block;margin-top:14px;font-style:normal;font-size:15px;letter-spacing:.18em;color:var(--dim)}
  #mute{right:18px;top:14px;pointer-events:auto;cursor:pointer;background:none;border:0;color:var(--dim);font-size:13px;letter-spacing:.14em;padding:8px;text-shadow:inherit;font-family:inherit}
  #mute:hover{color:var(--ink)}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(ellipse at 50% 55%,rgba(2,8,20,.35),rgba(1,4,10,.82));transition:opacity 1.4s ease;z-index:5;cursor:pointer}
  #intro.gone{opacity:0;pointer-events:none}
  #intro h1{margin:0;font-weight:100;font-size:clamp(44px,9vw,120px);letter-spacing:.42em;text-indent:.42em;text-shadow:0 0 40px rgba(90,230,255,.8)}
  #intro p{margin:18px 0 0;font-size:clamp(13px,1.6vw,17px);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  #keys{margin-top:44px;display:grid;grid-template-columns:auto auto;gap:10px 22px;text-align:left;font-size:15px;color:var(--ink);letter-spacing:.04em}
  #keys span{color:var(--dim)}
  kbd{font:inherit;font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid rgba(140,225,255,.5);background:rgba(10,40,70,.5);margin-right:3px}
  #go{margin-top:46px;font-size:14px;letter-spacing:.3em;color:var(--glow);text-transform:uppercase;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="stat" class="hud"><div id="cyc"></div><div id="sparks"></div></div>
<div id="pats" class="hud"></div>
<div id="banner" class="hud"><b id="bt"></b><i id="bs"></i></div>
<div id="hint" class="hud"></div>
<button id="mute" class="hud" aria-label="Звук">звук · вкл</button>

<div id="intro">
  <h1>ДРЕЙФ</h1>
  <p>спокойная змейка · без поражений</p>
  <div id="keys">
    <div><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> или <kbd>WASD</kbd></div><span>плыть / поворачивать на 90°</span>
    <div><kbd>Пробел</kbd></div><span>зажечь узор · зов искр · шагнуть в портал</span>
    <div><kbd>M</kbd></div><span>звук</span>
  </div>
  <div id="go">нажмите любую клавишу</div>
</div>

<script>
(() => {
'use strict';

/* ================================================================
   ДРЕЙФ — прототип спокойной змейки
   Два поля: внутреннее (сетка, узоры) и внешнее (свободный дрейф).
   Сцена рисуется в 2D-канвас, затем WebGL2-пост: bloom, хроматика,
   растяжение пространства (warp) и «туннель» перехода между полями.
   ================================================================ */

const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const wrapAng = a => { a = (a + PI) % TAU; if (a < 0) a += TAU; return a - PI; };
const rnd = Math.random;
const rr = (a, b) => a + rnd() * (b - a);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const roman = n => { const m = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; };

const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

/* ---------------- canvases ---------------- */
const view = $('view');
const scene = document.createElement('canvas');
const ctx = scene.getContext('2d', { alpha: false });
let W = 0, H = 0, S = 1, quality = 1;

/* ---------------- game constants ---------------- */
const HUES = [186, 308, 44, 152, 262, 8, 214, 336];
const SYMS = [6, 8, 5, 7, 9, 12];
const ROOTS = [0, 2, -3, 5, -1, 3, -5, 7];
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up right down left

const G = {
  time: 0, mode: 'outer', cycle: 0, sparks: 0, phase: 'play', intro: true,
  trans: null, mix: 1, spaceAt: -9, bloom: null, bgPending: null, gateCd: 0,
  taught: {}, totalSparks: 0,
};
const hueNow = () => HUES[G.cycle % HUES.length];
const costNow = () => 2 + Math.min(G.cycle, 4);
const countNow = () => Math.min(3 + G.cycle, 6);

/* ================================================================
   AUDIO — генеративный пентатонический эмбиент
   ================================================================ */
const Aud = {
  ac: null, muted: false, bus: null, master: null, pad: [], noise: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = this.ac = new AC();
    const master = this.master = ac.createGain(); master.gain.value = this.muted ? 0 : .6;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    const bus = this.bus = ac.createGain();
    const dl = ac.createDelay(1.5); dl.delayTime.value = .38;
    const fb = ac.createGain(); fb.gain.value = .45;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2100;
    const wet = ac.createGain(); wet.gain.value = .55;
    bus.connect(master); bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(master);
    // noise buffer for whooshes
    const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = nb;
    // pad
    const lfo = ac.createOscillator(); lfo.frequency.value = .06; const lg = ac.createGain(); lg.gain.value = .012; lfo.connect(lg); lfo.start();
    [.5, .75, 1.002].forEach((m, i) => {
      const o = ac.createOscillator(); o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = 220 * m;
      const g = ac.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(.034, ac.currentTime + 5);
      lg.connect(g.gain); o.connect(g); g.connect(bus); o.start(); this.pad.push({ o, m });
    });
    this.retune();
  },
  root() { return 220 * Math.pow(2, ROOTS[G.cycle % ROOTS.length] / 12); },
  retune() { if (!this.ac) return; const r = this.root(); this.pad.forEach(p => p.o.frequency.setTargetAtTime(r * p.m, this.ac.currentTime, 1.6)); },
  hz(deg) { const o = [0, 2, 4, 7, 9]; const oc = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5; return this.root() * Math.pow(2, (o[i] + 12 * oc) / 12); },
  tone(f, { dur = 1.3, type = 'sine', vol = .12, delay = 0, attack = .012 } = {}) {
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + dur + .05);
  },
  note(deg, o = {}) { this.tone(this.hz(deg), o); },
  whoosh(vol = .22, dur = .6, f0 = 280, f1 = 2400) {
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime, s = ac.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur * .6); bp.frequency.exponentialRampToValueAtTime(f0 * .6, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .28); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.bus); s.start(t); s.stop(t + dur + .1);
    this.tone(200, { dur: dur, vol: .05, type: 'sine', attack: dur * .3 });
  },
  pick(big) { const d = (rnd() * 5 | 0) + 5 + (big ? 3 : 0); this.note(d, { vol: big ? .16 : .1, dur: 1.8, type: 'triangle' }); this.note(d + 2, { vol: .05, dur: 2.2, delay: .08 }); },
  step(n) { this.note(n + 3, { vol: .07, dur: .9, type: 'triangle' }); },
  arm() { this.note(9, { vol: .08, dur: 1.2 }); this.note(11, { vol: .06, dur: 1.4, delay: .09 }); },
  arp(n) { for (let i = 0; i < n; i++) this.note(i + 2, { vol: .11, dur: 2.2, delay: i * .07, type: i % 2 ? 'sine' : 'triangle' }); },
  refuse() { this.note(-2, { vol: .1, dur: 1.2, type: 'sine' }); this.note(-4, { vol: .08, dur: 1.4, delay: .1 }); },
  chord() { [0, 2, 4, 7, 9, 11, 14].forEach((d, i) => this.note(d + 2, { vol: .09, dur: 5, attack: .6, delay: i * .22, type: i % 2 ? 'sine' : 'triangle' })); },
  swell() { this.whoosh(.3, 1.4, 120, 1600); this.tone(this.root() / 2, { dur: 2, vol: .12, attack: .5 }); },
  toggle() { this.muted = !this.muted; if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : .6, this.ac.currentTime, .1); $('mute').textContent = this.muted ? 'звук · выкл' : 'звук · вкл'; },
};

/* ================================================================
   Sprites / helpers
   ================================================================ */
const sprites = {};
function spr(h) {
  h = ((Math.round(h / 6) * 6) % 360 + 360) % 360;
  if (sprites[h]) return sprites[h];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, `hsla(${h},100%,94%,1)`); g.addColorStop(.16, `hsla(${h},95%,70%,.8)`);
  g.addColorStop(.5, `hsla(${h},90%,52%,.22)`); g.addColorStop(1, `hsla(${h},90%,45%,0)`);
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return sprites[h] = c;
}
function glow(h, x, y, r, a) { if (a <= 0.003) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(spr(h), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ================================================================
   Layout / grid
   ================================================================ */
const grid = { cols: 24, rows: 14, cell: 40, x: 0, y: 0 };
function layoutGrid() {
  const portrait = H > W * 1.15;
  const cols = portrait ? 13 : 24, rows = portrait ? 22 : 14;
  grid.cell = Math.max(14, Math.min((W - 28) / cols, (H - 120) / rows));
  grid.x = (W - grid.cell * cols) / 2; grid.y = (H - grid.cell * rows) / 2 + 4;
  const changed = grid.cols !== cols || grid.rows !== rows;
  grid.cols = cols; grid.rows = rows;
  return changed;
}
const cellPx = c => ({ x: grid.x + (c.x + .5) * grid.cell, y: grid.y + (c.y + .5) * grid.cell });

/* ================================================================
   Patterns («узоры») on the grid
   ================================================================ */
const SHAPES = [
  { id: 'L1', tier: 0, m: 'DDRR' }, { id: 'G', tier: 0, m: 'RRRDD' }, { id: 'L2', tier: 0, m: 'DDDRRR' },
  { id: 'U', tier: 0, m: 'DDRRUU' }, { id: 'St', tier: 0, m: 'RDRD' },
  { id: 'Z', tier: 1, m: 'RRDDRR' }, { id: 'Hk', tier: 1, m: 'RRRDDL' }, { id: 'St2', tier: 1, m: 'RDRDRD' }, { id: 'C', tier: 1, m: 'RRDDLL' },
  { id: 'S', tier: 2, m: 'RRDLLDRR' }, { id: 'Zg', tier: 2, m: 'RDRDRDRD' }, { id: 'Sp', tier: 2, m: 'RRRDDDLLUR' },
];
function shapeCells(m) { let x = 0, y = 0; const c = [{ x, y }]; for (const ch of m) { if (ch === 'R') x++; else if (ch === 'L') x--; else if (ch === 'D') y++; else y--; c.push({ x, y }); } return c; }
function transformCells(c, rot, mir) {
  let r = c.map(p => ({ x: p.x, y: p.y }));
  for (let i = 0; i < rot; i++) r = r.map(p => ({ x: -p.y, y: p.x }));
  if (mir) r = r.map(p => ({ x: -p.x, y: p.y }));
  const mx = Math.min(...r.map(p => p.x)), my = Math.min(...r.map(p => p.y));
  return r.map(p => ({ x: p.x - mx, y: p.y - my }));
}
const inn = { patterns: [], gate: { x: 0, y: 0 }, gateArmedUntil: -1, gatePulse: 0 };

function genPatterns() {
  const { cols, rows } = grid, want = countNow();
  const tierMax = Math.min(2, Math.floor(G.cycle / 1.5));
  const pool = SHAPES.filter(s => s.tier <= tierMax);
  const used = new Set(); const pats = []; let blocked = new Set(); let halo = 2;
  const key = (x, y) => x + ',' + y;
  for (let tries = 0; pats.length < want && tries < 600; tries++) {
    if (tries === 250) halo = 1;
    let cand = pool.filter(s => !used.has(s.id)); if (!cand.length) { used.clear(); cand = pool; }
    const sh = cand[rnd() * cand.length | 0];
    const cells = transformCells(shapeCells(sh.m), rnd() * 4 | 0, rnd() < .5);
    const bw = Math.max(...cells.map(c => c.x)) + 1, bh = Math.max(...cells.map(c => c.y)) + 1;
    if (bw > cols - 2 || bh > rows - 2) continue;
    const ox = 1 + (rnd() * (cols - 1 - bw) | 0), oy = 1 + (rnd() * (rows - 1 - bh) | 0);
    const placed = cells.map(c => ({ x: c.x + ox, y: c.y + oy }));
    if (placed.some(c => blocked.has(key(c.x, c.y)))) continue;
    used.add(sh.id);
    for (const c of placed) for (let dx = -halo; dx <= halo; dx++) for (let dy = -halo; dy <= halo; dy++) blocked.add(key(c.x + dx, c.y + dy));
    const rev = placed.slice().reverse();
    pats.push({ id: sh.id, cells: placed, rev, lit: false, act: null, armedUntil: -1, armRev: false, prog: { n: 0, rev: false }, refuseAt: -9, ph: rnd() * 10, sweep: [], la: [] });
  }
  inn.patterns = pats;
  // gate cell: far from all patterns
  const near = new Set();
  for (const p of pats) for (const c of p.cells) for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) near.add(key(c.x + dx, c.y + dy));
  let g = null;
  for (let i = 0; i < 400 && !g; i++) { const x = 1 + (rnd() * (cols - 2) | 0), y = 1 + (rnd() * (rows - 2) | 0); if (!near.has(key(x, y))) g = { x, y }; }
  inn.gate = g || { x: 1, y: 1 };
  refreshHud();
}

/* ================================================================
   Background layers: the mandala that blooms after every cycle
   ================================================================ */
let bgLayers = []; // {params, items, hue}
let bake = null, bakeCtx = null, bakeSize = 0;
function buildLayer(p) {
  const r = mulberry32(p.seed), items = [], sym = p.sym;
  const norm = p.pats.map(cells => {
    const cx = cells.reduce((a, c) => a + c.x, 0) / cells.length, cy = cells.reduce((a, c) => a + c.y, 0) / cells.length;
    return cells.map(c => ({ x: c.x - cx, y: c.y - cy }));
  });
  const rings = 4 + (r() * 2 | 0);
  for (let k = 0; k < rings; k++) {
    const rad = .17 + k * .165, sc = .03 + k * .0065, pat = norm[(k + (r() * norm.length | 0)) % norm.length], off = r() * TAU;
    items.push({ k: 'ring', r: rad + .075, a: .22 });
    for (let s = 0; s < sym; s++) {
      const ang = off + s * TAU / sym, mir = s % 2 ? -1 : 1, ca = Math.cos(ang), sa = Math.sin(ang);
      const bx = rad * ca, by = rad * sa;
      const pts = pat.map(q => { const lx = q.x * sc * mir, ly = q.y * sc; return { x: bx + lx * -sa + ly * ca, y: by + lx * ca + ly * sa }; });
      items.push({ k: 'poly', pts, r: rad, a: .62 });
      items.push({ k: 'dot', x: pts[0].x, y: pts[0].y, r: rad, rad: 2.4 });
      items.push({ k: 'dot', x: pts[pts.length - 1].x, y: pts[pts.length - 1].y, r: rad, rad: 2.4 });
      // spoke to the next ring
      if (k < rings - 1) items.push({ k: 'line', x1: bx, y1: by, x2: (rad + .165) * Math.cos(ang + TAU / sym / 2), y2: (rad + .165) * Math.sin(ang + TAU / sym / 2), r: rad + .04, a: .16 });
    }
  }
  // central rosette
  for (let s = 0; s < sym; s++) {
    const a = s * TAU / sym;
    items.push({ k: 'petal', a, w: TAU / sym * .34, len: .13, r: .05 });
  }
  items.push({ k: 'ring', r: .045, a: .5 });
  items.push({ k: 'dot', x: 0, y: 0, r: 0, rad: 3 });
  return { items, hue: p.hue, params: p };
}
function drawLayer(c, L, rev, u, alpha) {
  const front = rev * 1.25;
  c.lineJoin = 'round'; c.lineCap = 'round';
  for (const it of L.items) {
    const fa = clamp((front - it.r) / .14, 0, 1); if (fa <= 0) continue;
    const A = fa * alpha;
    if (it.k === 'poly') {
      c.strokeStyle = `hsla(${L.hue},85%,68%,${it.a * A})`; c.lineWidth = 1.5; c.beginPath();
      it.pts.forEach((q, i) => i ? c.lineTo(q.x * u, q.y * u) : c.moveTo(q.x * u, q.y * u)); c.stroke();
    } else if (it.k === 'dot') {
      c.fillStyle = `hsla(${L.hue + 14},95%,80%,${.85 * A})`; c.beginPath(); c.arc(it.x * u, it.y * u, it.rad, 0, TAU); c.fill();
    } else if (it.k === 'ring') {
      c.strokeStyle = `hsla(${L.hue},70%,62%,${it.a * A})`; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, it.r * u, 0, TAU); c.stroke();
    } else if (it.k === 'line') {
      c.strokeStyle = `hsla(${L.hue},70%,62%,${it.a * A})`; c.lineWidth = 1; c.beginPath(); c.moveTo(it.x1 * u, it.y1 * u); c.lineTo(it.x2 * u, it.y2 * u); c.stroke();
    } else if (it.k === 'petal') {
      c.strokeStyle = `hsla(${L.hue + 20},90%,72%,${.55 * A})`; c.lineWidth = 1.4; c.beginPath();
      const a0 = it.a, w = it.w, l = it.len * u;
