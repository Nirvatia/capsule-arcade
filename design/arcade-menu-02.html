<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Павильон досуга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Tektur:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --enamel: #f1f5f2; --mint: #cfe4de; --teal: #0e4a4f; --red: #ff3a1d; --glass: #070d0f; --cream: #e6ddc4;
  --f-head: "Unbounded", "Arial Rounded MT Bold", sans-serif;
  --f-hud: "Tektur", "Arial Narrow", sans-serif;
  --f-hand: "Caveat", cursive;
  --bar: 64px;
  --redgloss: linear-gradient(180deg, #ff6a50, var(--red) 45%, #d92a10);
}
* { box-sizing: border-box; margin: 0; }
html { background: #061a1c; }
body { color: var(--teal); font: 500 17px/1.35 var(--f-hud); overflow-x: hidden; }
button, a { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* ===== TOPBAR ===== */
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--bar); padding: 0 12px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  background: linear-gradient(180deg, #fbfdfb, #e2ebe7); border-bottom: 3px solid var(--teal);
  box-shadow: 0 3px 0 #b9c8c3, 0 10px 22px rgba(0,0,0,.45);
}
.pill {
  height: 44px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 22px; cursor: pointer; text-decoration: none; color: var(--teal);
  background: linear-gradient(180deg, #fff, #e3ece8);
  box-shadow: 0 0 0 2px var(--teal), inset 0 -3px 0 rgba(14,74,79,.12), 0 3px 0 2px rgba(14,74,79,.25);
  transition: transform .1s, box-shadow .1s;
}
.pill:active { transform: translateY(2px); box-shadow: 0 0 0 2px var(--teal), inset 0 -1px 0 rgba(14,74,79,.12), 0 1px 0 2px rgba(14,74,79,.25); }
.pill:focus-visible { outline-color: var(--red); }
.back { padding: 0 20px 0 4px; }
.knob { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, #ff9a82, var(--red) 55%, #b81d08); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 0 2px #fff; transition: box-shadow .15s; }
.knob svg { width: 20px; height: 20px; color: #fff; transition: transform .15s; }
.back:hover .knob { box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 0 2px #fff, 0 0 16px 3px rgba(255,58,29,.7); }
.back:hover .knob svg { transform: translateX(-3px); }
.back b, .snd b { font: 700 14px var(--f-head); text-transform: uppercase; letter-spacing: .02em; }
.where {
  justify-self: center; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-radius: 10px;
  background: #dfe8e4; box-shadow: inset 0 2px 5px rgba(14,74,79,.28), 0 1px 0 #fff;
  font: 700 14px var(--f-hud); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
}
.where i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px 2px rgba(255,58,29,.7); }
.where small { padding-left: 12px; border-left: 2px solid #b4c4bf; font: 500 12px var(--f-hud); letter-spacing: .14em; color: #5b8b8a; }
.snd { padding: 0 5px 0 16px; }
.sw { position: relative; width: 50px; height: 34px; border-radius: 17px; background: #0c2326; box-shadow: inset 0 3px 6px #000; transition: background .15s; }
.sw i { position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(180deg, #fff, #9fb2ac); box-shadow: 0 2px 3px rgba(0,0,0,.5); transition: transform .15s; }
.snd[aria-pressed="true"] .sw { background: var(--redgloss); }
.snd[aria-pressed="true"] .sw i { transform: translateX(16px); }

/* ===== МИР: плоское панно ===== */
.world { position: relative; isolation: isolate; overflow: hidden; min-height: calc(100vh - var(--bar)); }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
.world::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 11px), repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 1px, transparent 1px 11px); }
.world::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%); }
.rays { transform-origin: 800px 560px; animation: spin 360s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cl1 { animation: float 50s ease-in-out infinite alternate; }
.cl2 { animation: float 70s ease-in-out infinite alternate-reverse; }
.cl3 { animation: float 40s ease-in-out infinite alternate; }
@keyframes float { to { transform: translateX(90px); } }
.ship { animation: drift 150s linear infinite; }
@keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(2100px); } }

.scene { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 40px 20px 110px; display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; gap: 40px; align-items: start; }
.poster, .honor { display: none; }
@media (min-width: 1180px) { .poster, .honor { display: block; } }
.poster {
  justify-self: end; width: 200px; margin-top: 190px; padding: 12px; transform: rotate(-2deg); background: #efe9d6;
  border: 6px solid var(--red); border-radius: 4px; text-align: center; box-shadow: 0 14px 26px rgba(0,0,0,.55);
}
.poster svg { width: 100%; display: block; margin-bottom: 8px; }
.poster b { display: block; font: 900 19px/1.1 var(--f-head); text-transform: uppercase; letter-spacing: -.02em; }
.poster span { display: block; margin: 10px -12px -12px; padding: 7px; background: var(--red); color: #fff; font: 700 12px var(--f-hud); letter-spacing: .16em; text-transform: uppercase; }
.honor {
  position: relative; justify-self: start; width: 230px; margin-top: 260px; padding: 16px 14px 12px; transform: rotate(1.5deg);
  border-radius: 10px; background: linear-gradient(180deg, #fff, #e3ece8); box-shadow: 0 0 0 3px var(--teal), 0 14px 26px rgba(0,0,0,.55);
}
.honor::before, .honor::after { content: ""; position: absolute; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #9fb2ac; box-shadow: inset 0 1px 1px rgba(0,0,0,.4); }
.honor::before { left: 8px; } .honor::after { right: 8px; }
.honor h2 { margin-bottom: 10px; text-align: center; font: 900 15px var(--f-head); text-transform: uppercase; color: var(--red); }
.honor ol { list-style: none; padding: 0; display: grid; gap: 8px; }
.honor li { display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; }
.honor .medal { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 50% 30%, var(--p1), var(--p2)); box-shadow: 0 0 0 2px var(--teal); }
.honor .medal svg { width: 20px; height: 20px; }
.honor li b { font: 700 13px var(--f-head); text-transform: uppercase; }
.honor li span { font: 700 13px var(--f-hud); letter-spacing: .1em; color: #5b8b8a; }

/* ===== АВТОМАТ ===== */
.machine {
  position: relative; z-index: 2; padding: 16px 52px 24px; border-radius: 48px 48px 20px 20px;
  background: linear-gradient(90deg, #d0dbd7 0, #fff 10%, #eef3f0 50%, #fff 90%, #cbd6d2 100%);
  box-shadow: inset 0 3px 0 #fff, inset 0 -6px 0 rgba(14,74,79,.15), 0 0 0 3px var(--teal), 0 34px 50px rgba(0,0,0,.6);
}
.feet { position: absolute; left: 0; right: 0; bottom: -26px; display: flex; justify-content: space-between; padding: 0 44px; z-index: -1; }
.feet i { width: 72px; height: 28px; border-radius: 0 0 10px 10px; background: linear-gradient(#b8c9c4, #5f7571); }
.machine::after { content: ""; position: absolute; left: -5%; right: -5%; bottom: -44px; height: 40px; z-index: -2; background: radial-gradient(ellipse, rgba(0,0,0,.7), transparent 70%); }

.tube { position: absolute; top: 108px; bottom: 170px; width: 22px; border-radius: 11px; overflow: hidden; background: linear-gradient(90deg, rgba(255,255,255,.7), rgba(255,255,255,.08) 38%, rgba(0,0,0,.3)), linear-gradient(180deg, #ff6a4d, #c4180a); box-shadow: 0 0 0 3px #b6c6c1, 0 0 0 5px var(--teal), 0 0 16px rgba(255,58,29,.55); }
.tube.l { left: 15px; } .tube.r { right: 15px; }
.tube::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.8) 0 2px, transparent 3px) 0 0 / 22px 38px, radial-gradient(circle, rgba(255,255,255,.5) 0 1.5px, transparent 2.5px) 8px 14px / 22px 52px; animation: rise 5s linear infinite; }
@keyframes rise { to { background-position: 0 -190px, 8px -246px; } }

.sign {
  display: flex; align-items: center; gap: 14px; margin: 0 0 16px; padding: 10px 16px 10px 12px; border-radius: 24px;
  background: linear-gradient(180deg, #fff, #f2f8f5 55%, #dcebe5);
  box-shadow: inset 0 0 0 3px #b9c8c3, inset 0 0 26px rgba(255,205,140,.65), 0 0 0 3px var(--teal), 0 0 30px rgba(255,200,140,.25);
}
.logo { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, #ff8a6e, var(--red) 55%, #a81808); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--teal), 0 0 18px rgba(255,58,29,.6); }
.logo svg { width: 36px; height: 36px; color: #fff; }
.sign h1 { font: 900 clamp(28px, 7.4vw, 46px)/.95 var(--f-head); letter-spacing: -.03em; color: var(--red); text-transform: uppercase; text-shadow: 0 0 14px rgba(255,58,29,.3); }
.sign small { display: block; margin-top: 4px; font: 700 11px var(--f-hud); letter-spacing: .2em; text-transform: uppercase; color: var(--teal); }
.lamps { margin-left: auto; display: flex; flex-direction: column; gap: 6px; }
.lamps i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px 2px rgba(255,58,29,.8); }
.lamps i:nth-child(2) { background: #ffb02e; box-shadow: 0 0 8px 2px rgba(255,176,46,.8); animation: blink 3.2s infinite; }
.lamps i:nth-child(3) { background: #35e0cf; box-shadow: 0 0 8px 2px rgba(53,224,207,.8); }
@keyframes blink { 0%, 88%, 100% { opacity: 1; } 92% { opacity: .2; } }

/* купол */
.dome {
  --cap: min(84px, calc((min(100vw - 40px, 560px) - 104px - 40px) / 5));
  position: relative; padding: 46px 18px 16px; border-radius: 50% 50% 16px 16px / 44% 44% 16px 16px;
  background: radial-gradient(ellipse at 50% 100%, rgba(255,90,50,.45), rgba(255,58,29,.06) 62%), linear-gradient(180deg, #0d1719, #071012);
  box-shadow: inset 0 0 0 5px rgba(255,255,255,.28), inset 0 0 40px rgba(0,0,0,.85), 0 0 0 5px #b6c6c1, 0 0 0 8px var(--teal);
}
.dome::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.22), rgba(255,255,255,0) 28%), radial-gradient(ellipse at 22% 10%, rgba(255,255,255,.18), transparent 30%); }
.ring { height: 12px; margin: 10px -4px 0; border-radius: 6px; background: linear-gradient(180deg, #fff, #9fb2ac); box-shadow: 0 2px 0 var(--teal); }
.row { display: flex; justify-content: center; min-height: calc(var(--cap) * .9); }
.row + .row { margin-top: calc(var(--cap) * -.1); }
.row:last-child { min-height: var(--cap); }
.cap { position: relative; z-index: 1; width: var(--cap); height: var(--cap); margin: 0 calc(var(--cap) * -.02); padding: 0; border: 0; background: none; cursor: pointer; transform: translateX(var(--dx, 0)); transition: transform .15s; }
.cap:hover, .cap.sel { z-index: 5; transform: translate(var(--dx, 0), -8px) scale(1.08); }
.cap.gone { visibility: hidden; }
.cap:focus-visible { outline-offset: -2px; border-radius: 50%; }
.ball { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; transform: rotate(var(--r, 0deg));
  background: radial-gradient(circle at 50% 80%, var(--p1), var(--p2) 75%) top / 100% 50% no-repeat, linear-gradient(180deg, #fff, #cbd8d4) bottom / 100% 50% no-repeat;
  box-shadow: inset -7px -10px 18px rgba(0,0,0,.32), inset 5px 5px 10px rgba(255,255,255,.4), 0 10px 16px rgba(0,0,0,.55); }
.ball::before { content: ""; position: absolute; left: 0; right: 0; top: 46%; height: 8%; background: linear-gradient(180deg, #8aa09a, #e9f0ed 45%, #6d837d); }
.ball .ico { position: absolute; left: 50%; top: 9%; width: 38%; height: 38%; transform: translateX(-50%); color: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.ball .n { position: absolute; left: 0; right: 0; top: 58%; text-align: center; font: 700 calc(var(--cap) * .18)/1 var(--f-hud); color: var(--p2); letter-spacing: .02em; }
.cap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0, rgba(255,255,255,0) 18%), radial-gradient(circle at 72% 86%, rgba(255,255,255,.22), transparent 26%); }
.cap.sel .ball { box-shadow: inset -7px -10px 18px rgba(0,0,0,.32), inset 5px 5px 10px rgba(255,255,255,.4), 0 0 0 3px #fff, 0 0 28px 8px var(--p1); }

/* пульт */
.panel {
  position: relative; margin-top: 18px; padding: 14px; border-radius: 22px; display: grid; gap: 14px; align-items: center;
  grid-template-columns: 92px 1fr 100px; grid-template-areas: "s s s" "g i b";
  background: linear-gradient(180deg, #dce7e3, #c8d8d3); box-shadow: inset 0 3px 8px rgba(14,74,79,.25), inset 0 -2px 0 #fff;
}
.gauge { grid-area: g; width: 100%; }
.gauge text { font: 700 9px var(--f-hud); letter-spacing: .1em; fill: var(--teal); }
#needle { transform-origin: 50px 50px; transform: rotate(-110deg); transition: transform .7s cubic-bezier(.3, 1.7, .5, 1); }
#needle g { transform-origin: 50px 50px; animation: tremble .25s infinite alternate; }
@keyframes tremble { to { transform: rotate(2.2deg); } }
.steps { grid-area: i; counter-reset: s; list-style: none; padding: 8px 6px; display: flex; justify-content: space-around; border-radius: 12px; background: var(--enamel); box-shadow: inset 0 2px 6px rgba(14,74,79,.2); }
.steps li { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 700 11px var(--f-hud); letter-spacing: .1em; text-transform: uppercase; }
.steps li::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 13px; }

/* паспорт: фиксированная высота, контент не двигает пульт */
.screen { grid-area: s; position: relative; overflow: hidden; height: 248px; padding: 14px 16px; border-radius: 14px; background: var(--glass); color: #ff6b52; box-shadow: inset 0 0 22px rgba(255,58,29,.25), inset 0 3px 8px #000; text-shadow: 0 0 8px rgba(255,58,29,.55); }
.screen::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); }
.scan { position: absolute; left: 0; right: 0; top: -35%; height: 35%; z-index: 2; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(255,100,70,.3), transparent); animation: sweep .7s ease-out; }
@keyframes sweep { to { top: 105%; } }
.p-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; height: 26px; border-bottom: 1px dashed #5a2a24; font: 500 11px var(--f-hud); letter-spacing: .16em; text-transform: uppercase; color: #b4503f; }
.p-head span:first-child { display: flex; align-items: center; gap: 8px; }
.p-head span:first-child::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px 2px rgba(255,58,29,.8); }
.tag { padding: 1px 10px; border: 1px solid #b4503f; border-radius: 999px; }
.p-title { display: flex; align-items: center; gap: 10px; height: 40px; margin-top: 6px; }
.p-title svg { flex: none; width: 30px; height: 30px; color: #ff5a40; filter: drop-shadow(0 0 6px rgba(255,58,29,.6)); }
.p-name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 700 clamp(20px, 5.2vw, 30px)/1.1 var(--f-head); letter-spacing: -.02em; text-transform: uppercase; color: #ff5a40; }
.p-desc { height: 2.5em; margin: 2px 0 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 16px; line-height: 1.25; }
.p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.p-grid small { display: block; margin-bottom: 4px; font: 500 10px var(--f-hud); letter-spacing: .16em; text-transform: uppercase; color: #b4503f; }
.p-grid b { font: 700 20px/1 var(--f-hud); color: #ff5a40; }
.pips { display: flex; gap: 4px; padding-top: 4px; }
.pips i { width: 20px; height: 9px; background: #3a1a16; }
.pips i.on { background: #ff5a40; box-shadow: 0 0 8px rgba(255,90,60,.9); }
.wide { grid-column: 1 / 3; }
.digits { display: flex; gap: 3px; }
.digits i { min-width: 24px; padding: 0 3px; text-align: center; font: normal 700 22px/30px var(--f-hud); color: #ff5a40; background: #170908; border: 1px solid #3a1a16; border-radius: 3px; }
.idle { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.idle b { font: 700 24px var(--f-head); letter-spacing: -.01em; text-transform: uppercase; }
.idle b::after { content: ""; display: inline-block; width: 12px; height: 22px; margin-left: 8px; vertical-align: -3px; background: #ff5a40; animation: cur 1s steps(1) infinite; }
.idle span { font: 500 13px var(--f-hud); letter-spacing: .14em; text-transform: uppercase; color: #b4503f; }
@keyframes cur { 50% { opacity: 0; } }

.go {
  grid-area: b; justify-self: end; width: 100px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; border-radius: 50%; cursor: pointer; color: #fff; background: radial-gradient(circle at 35% 28%, #ff9a82, var(--red) 50%, #a81808);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 0 0 5px #fff, 0 0 0 8px var(--teal), 0 7px 0 8px #09353a;
  font: 700 12px var(--f-hud); letter-spacing: .12em; text-transform: uppercase; transition: transform .1s, box-shadow .1s;
}
.go svg { width: 34px; height: 34px; }
.go:hover:not(:disabled) { box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 0 0 5px #fff, 0 0 0 8px var(--teal), 0 7px 0 8px #09353a, 0 0 28px 8px rgba(255,58,29,.7); }
.go:active:not(:disabled) { transform: translateY(5px); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 0 0 5px #fff, 0 0 0 8px var(--teal), 0 2px 0 8px #09353a; }
.go:disabled { filter: grayscale(.85) brightness(.85); cursor: default; }
.go.turn svg { animation: crank .65s ease-in-out; }
@keyframes crank { to { transform: rotate(720deg); } }
.note { position: absolute; right: 16px; bottom: -24px; z-index: 3; padding: 6px 14px 8px; transform: rotate(-4deg); background: #f4e9a6; color: #3a3320; font: 600 21px/1 var(--f-hand); box-shadow: 2px 4px 0 rgba(0,0,0,.2); }
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 46px; height: 16px; margin-left: -23px; transform: rotate(3deg); background: rgba(255,255,255,.55); }

/* лоток: фиксированная высота */
.tray { position: relative; height: 140px; display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 20px; margin: 34px 6px 0; padding: 22px 24px 10px; overflow: hidden; border-radius: 16px 16px 38px 38px / 16px 16px 26px 26px; background: #0a1011; box-shadow: inset 0 8px 18px #000, 0 0 0 4px #b9c8c3, 0 0 0 7px var(--teal); }
.tray::before { content: "Выдача"; position: absolute; top: 7px; left: 50%; transform: translateX(-50%); font: 700 10px var(--f-hud); letter-spacing: .3em; text-transform: uppercase; color: #3f6b6e; }
.tray-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #6b3a33; font: 700 13px var(--f-hud); letter-spacing: .18em; text-transform: uppercase; }
.tray-info { min-width: 0; visibility: hidden; }
.tray.full .tray-empty { visibility: hidden; } .tray.full .tray-info { visibility: visible; }
.tc { position: relative; width: 84px; height: 84px; opacity: 0; }
.tray.full .tc { opacity: 1; }
.tc::before { content: ""; position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px; border-radius: 50%; opacity: 0; transition: opacity .5s; background: radial-gradient(circle, var(--p1), transparent 65%); }
.tc.open::before { opacity: .6; }
.tc i { position: absolute; left: 0; right: 0; z-index: 1; transition: transform .55s cubic-bezier(.3, 1.6, .5, 1); }
.tc .t { top: 0; height: 50%; z-index: 2; border-radius: 84px 84px 0 0; background: radial-gradient(circle at 50% 120%, var(--p1), var(--p2) 70%); box-shadow: inset 3px 3px 8px rgba(255,255,255,.4); }
.tc .b { bottom: 0; height: 50%; border-radius: 0 0 84px 84px; background: linear-gradient(180deg, #fff, #cbd8d4); box-shadow: inset -4px -4px 8px rgba(0,0,0,.25); }
.tc.open .t { transform: translate(-8px, -30px) rotate(-24deg); }
.toy { position: absolute; left: 50%; top: 50%; z-index: 1; width: 44px; height: 44px; margin: -36px 0 0 -22px; color: #fff; opacity: 0; transform: scale(.3); transition: transform .45s .15s cubic-bezier(.3, 1.8, .5, 1), opacity .2s .15s; filter: drop-shadow(0 0 6px var(--p1)); }

.tray-info .gn { margin: 4px 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 700 22px/1.1 var(--f-head); text-transform: uppercase; color: #ff5a40; text-shadow: 0 0 8px rgba(255,58,29,.6); }

.batch { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 52px; color: var(--teal); font: 700 13px var(--f-hud); letter-spacing: .16em; text-transform: uppercase; }
.batch[hidden] { display: none; }
.batch button { width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; color: var(--teal); background: linear-gradient(180deg, #fff, #cfdbd7); font: 700 18px var(--f-hud); box-shadow: 0 0 0 2px var(--teal); }
.batch button:disabled { opacity: .35; cursor: default; }
.toast { position: fixed; left: 50%; bottom: 22px; z-index: 50; max-width: calc(100% - 32px); padding: 10px 20px; border-radius: 999px; background: var(--glass); color: #ff7a63; border: 2px solid #1d3a3d; font: 700 15px var(--f-hud); letter-spacing: .05em; text-align: center; visibility: hidden; transform: translate(-50%, 160%); transition: transform .25s, visibility .25s; }
.toast.show { visibility: visible; transform: translate(-50%, 0); }
.fly { position: fixed; z-index: 60; pointer-events: none; border-radius: 50%; }

/* ===== АДАПТИВ ===== */
@media (max-width: 1099px) { .scene { grid-template-columns: minmax(0, 560px); justify-content: center; } }
@media (max-width: 760px) { .where { display: none; } .topbar { grid-template-columns: auto auto; justify-content: space-between; } }

const rnd = i => { const x = Math.sin(i * 12.9898 + 1) * 43758.5453; return x - Math.floor(x); };
if (reduce) $("bg").pauseAnimations();

let ac;
function tone(f1, f2, d, wave = "square", v = .05, t0 = 0) {
  if (!sound) return;
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain();
  o.type = wave; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
const sTick = () => tone(1100, 800, .04, "square", .04);
const sCrank = () => { for (let k = 0; k < 6; k++) tone(320 + k * 25, 180, .035, "square", .05, k * .1); };
const sThunk = () => tone(190, 50, .2, "sine", .3);
const sPop = () => tone(420, 1000, .1, "triangle", .14);
$("snd").addEventListener("click", e => { sound = !sound; e.currentTarget.setAttribute("aria-pressed", sound); if (sound) sTick(); });
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.id); toast.id = setTimeout(() => el.classList.remove("show"), 2600); }

$("honor").innerHTML = [...GAMES].sort((a, b) => b.r - a.r).slice(0, 3)
  .map(g => `<li style="${pal(g)}"><span class="medal">${svg(g.ico)}</span><b>${g.n}</b><span>${fmt(g.r)}</span></li>`).join("");

function fill(n) {
  const counts = ROWS.map(() => 0), pages = Math.ceil(GAMES.length / PER_PAGE);
  let left = n;
  for (let r = ROWS.length - 1; r >= 0 && left > 0; r--) { counts[r] = Math.min(ROWS[r], left); left -= counts[r]; }
  return pages > 1 ? counts : counts.slice(counts.findIndex(c => c > 0));
}
function render() {
  const pages = Math.ceil(GAMES.length / PER_PAGE);
  page = Math.min(Math.max(page, 1), pages);
  const start = (page - 1) * PER_PAGE, items = GAMES.slice(start, start + PER_PAGE);
  let k = 0;
  $("rows").innerHTML = fill(items.length).map(cnt => {
    let h = '<div class="row">';
    for (let j = 0; j < cnt; j++) {
      const i = start + k++, g = GAMES[i];
      h += `<button class="cap" style="${pal(g)};--r:${Math.round((rnd(i) - .5) * 40)}deg;--dx:${Math.round((rnd(i + 40) - .5) * 8)}px" data-i="${i}" aria-pressed="false" aria-label="Капсула ${pad(i + 1)}: ${g.n}"><span class="ball">${svg(g.ico, "ico")}<span class="n">${pad(i + 1)}</span></span></button>`;
    }
    return h + "</div>";
  }).join("");
  sel = null; $("go").disabled = true; show(null);
  $("batch").hidden = pages < 2;
  $("batch").innerHTML = `<button data-p="${page - 1}" ${page === 1 ? "disabled" : ""} aria-label="Предыдущая партия">&lsaquo;</button>Партия ${page} из ${pages}<button data-p="${page + 1}" ${page === pages ? "disabled" : ""} aria-label="Следующая партия">&rsaquo;</button>`;
}

function show(i) {
  const s = $("screen"), scan = reduce ? "" : '<div class="scan"></div>';
  if (i == null) {
    s.innerHTML = `${scan}<div class="idle"><b>Выберите капсулу</b><span>В куполе капсул: ${GAMES.length}</span><span>Полимер в норме</span></div>`;
    $("needle").style.transform = "rotate(-110deg)"; return;
  }
  const g = GAMES[i];
  s.innerHTML = `${scan}
    <div class="p-head"><span>Капсула ${pad(i + 1)}</span><span class="tag">${g.g}</span></div>
    <div class="p-title">${svg(g.ico)}<div class="p-name">${g.n}</div></div>
    <div class="p-desc">${g.d}</div>
    <div class="p-grid">
      <div><small>Сложность</small><div class="pips">${[1, 2, 3, 4, 5].map(x => `<i class="${x <= g.lvl ? "on" : ""}"></i>`).join("")}</div></div>
      <div><small>Игроков</small><b>${g.pl}</b></div>
      <div class="wide"><small>Рекорд</small><div class="digits">${String(g.r).padStart(6, "0").split("").map(c => `<i>${c}</i>`).join("")}</div></div>
    </div>`;
  $("needle").style.transform = `rotate(${-110 + (g.r / MAXREC) * 220}deg)`;
}
$("rows").addEventListener("pointerover", e => { const c = e.target.closest(".cap"); if (c && !busy && +c.dataset.i !== show.last) { show(+c.dataset.i); show.last = +c.dataset.i; } });
$("rows").addEventListener("pointerleave", () => { if (!busy) { show(sel); show.last = null; } });
$("rows").addEventListener("focusin", e => { const c = e.target.closest(".cap"); if (c && !busy) show(+c.dataset.i); });
$("rows").addEventListener("click", e => {
  const c = e.target.closest(".cap"); if (!c || busy) return;
  document.querySelectorAll(".cap.sel").forEach(x => { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
  c.classList.add("sel"); c.setAttribute("aria-pressed", "true");
  sel = +c.dataset.i; $("go").disabled = false; show(sel); sTick();
});

$("go").addEventListener("click", () => {
  if (busy) return;
  if (sel == null) { toast("Сначала выберите капсулу."); return; }
  busy = true; $("go").classList.add("turn"); sCrank();
  const i = sel, cap = document.querySelector(`.cap[data-i="${i}"]`);
  setTimeout(() => { $("go").classList.remove("turn"); drop(cap, i); }, reduce ? 0 : 650);
});
function drop(cap, i) {
  const g = GAMES[i];
  if (gone) gone.classList.remove("gone");
  $("tray").classList.remove("full"); $("tc").classList.remove("open");
  const ball = cap.querySelector(".ball"), a = ball.getBoundingClientRect(), tc = $("tc").getBoundingClientRect();
  $("tc").style.cssText = pal(g); $("toy").innerHTML = svg(g.ico);
  cap.classList.remove("sel"); cap.classList.add("gone"); cap.setAttribute("aria-pressed", "false"); gone = cap;
  const land = () => {
    $("tk").textContent = `Выдано: капсула ${pad(i + 1)}`; $("tn").textContent = g.n;
    $("launch").dataset.i = i; $("tray").classList.add("full"); sThunk();
    setTimeout(() => { $("tc").classList.add("open"); sPop(); busy = false; sel = null; $("go").disabled = true; show(null); }, reduce ? 0 : 280);
  };
  if (reduce) { land(); return; }
  const fly = ball.cloneNode(true);
  fly.classList.add("fly");
  fly.style.cssText = `${pal(g)};--cap:${a.width}px;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;--r:${cap.style.getPropertyValue("--r")}`;
  document.body.append(fly);
  const dx = tc.left + tc.width / 2 - (a.left + a.width / 2), dy = tc.top + tc.height / 2 - (a.top + a.height / 2), s = tc.width / a.width;
  const T = (x, y) => `translate(${x}px, ${y}px) scale(${s})`;
  fly.animate([
    { transform: "translate(0,0) scale(1)", easing: "cubic-bezier(.5,0,.9,.55)" },
    { transform: T(dx, dy), offset: .78, easing: "ease-out" },
    { transform: T(dx, dy - 16), offset: .89, easing: "ease-in" },
    { transform: T(dx, dy) }
  ], { duration: 850, fill: "forwards" }).finished.then(() => { fly.remove(); land(); });
}
$("launch").addEventListener("click", e => { e.preventDefault(); toast(`Запуск: «${GAMES[+e.currentTarget.dataset.i].n}». Здесь — переход на страницу игры.`); });
$("batch").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return; page = +b.dataset.p; render(); });
document.addEventListener("click", e => { if (e.target.closest("a[href='#']")) e.preventDefault(); });
render();
</script>
</body>
</html>
